# Default configuration for Crestix Probe PINO (Physics-Informed Fourier Neural Operator)
# Target Dataset: LarNO UKEA Terrain Grid

model:
  # Input physical channels:
  #   0: dem (m)
  #   1: rainfall_rate (m/s, converted from mm/h via / 3.6e6)
  #   2: initial_water_depth (m)
  #   3: manning_n (s * m^(-1/3))
  # If append_grid_coords=true, 3 normalized (t, x, y) coordinate channels are appended internally.
  in_channels: 4
  append_grid_coords: true
  width: 32
  modes_t: 4
  modes_x: 12
  modes_y: 12
  n_layers: 4
  padding_t: 2
  padding_x: 4
  padding_y: 4
  # Output heads:
  #   - water_depth h >= 0 (m)
  #   - latent_velocity (u, v) in (m/s) for unsupervised SWE residual calculation
  predict_latent_velocity: true
  nonnegative_depth_mode: "softplus"  # options: "softplus", "relu", "none"
  input_steps: 1
  forecast_steps: 12
  wall_height: 50.0

grid_metadata:
  dx: 8.0                             # spatial grid spacing x (m) - native LarNO UKEA 8m
  dy: 8.0                             # spatial grid spacing y (m) - native LarNO UKEA 8m
  dt: 300.0                           # dataset time interval (s) - 5-min UKEA cadence
  grid_height: 32
  grid_width: 32
  crs_or_domain: "LarNO-UKEA-32x32"

physics:
  gravity: 9.81                       # m/s^2
  dx: 8.0                             # spatial grid spacing x (m) - native LarNO UKEA 8m
  dy: 8.0                             # spatial grid spacing y (m) - native LarNO UKEA 8m
  dt: 300.0                           # dataset time interval (s) - 5-min UKEA cadence
  wet_dry_eps: 1.0e-3                 # wetting-drying depth threshold (m)
  default_manning_n: 0.035            # s * m^(-1/3)
  boundary_conditions:
    north: "closed"
    south: "open"
    east: "closed"
    west: "closed"

losses:
  data_loss_type: "mse"               # options: "mse", "l1", "rel_l2"
  weights:
    data: 1.0
    pde_continuity: 1.0
    pde_momentum_x: 0.25
    pde_momentum_y: 0.25
    mass_conservation: 0.5
    boundary_condition: 0.5
    initial_condition: 1.0
    nonnegative_depth: 1.0
