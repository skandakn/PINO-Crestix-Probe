# ==============================================================================
# Crestix Probe — LarNO Shared Preprocessing & Pipeline Configuration
# ==============================================================================
# This configuration governs dataset ingestion, spatial coordinates, temporal
# alignment, building mask handling, and train-only normalization parameters
# shared between the ConvLSTM-based U-Net and PINO deep-learning repositories.
# ==============================================================================

version: "1.0.0"
dataset_name: "LarNO UKEA & Futian Urban Flood Benchmark"
hf_repository: "https://huggingface.co/datasets/holmescao/LarNO-dataset"

# --- Partition Summary ---
split_manifest:
  total_events: 1000
  train_events: 80    # 64 Futian + 16 UKEA
  val_events: 10      # 8 Futian + 2 UKEA
  test_events: 10     # 8 Futian + 2 UKEA
  strategy: "event_level_stratified_location"
  disjoint_enforced: true
  zero_leakage_rule: "All scalers, statistical moments, and feature scalers must be fit strictly on train split."

# --- Catchment Specifications ---
catchments:
  futian:
    name: "Futian, Shenzhen"
    tag: "region1_20m"
    spatial_resolution_m: 20.0
    grid_shape: [400, 560]
    total_grid_cells: 224000
    physical_dimensions_m: [8000.0, 11200.0]
    physical_area_sq_km: 89.6
    time_interval_minutes: 5.0
    total_timesteps: 72
    event_duration_hours: 6.0
    rainfall:
      units: "mm / 5min"
      steps: 72
      dtype: "float64"
    water_depth:
      units: "m"
      steps: 72
      dtype: "float64"
    temporal_alignment:
      mode: "direct_1to1"
      rainfall_substeps_per_frame: 1
    building_mask:
      rule: "dem >= 50.0 or isnan(dem)"
      barrier_wall_height_m: 50.0
      zero_rain_on_buildings: true
    normalization:
      fit_split: "train (64 events)"
      dem:
        mean: 34.324936
        std: 18.215164
        min: 0.693749
        max: 50.0
      rainfall:
        mean: 0.742815
        std: 1.489230
        min: 0.0
        max: 18.520000
      water_depth:
        mean: 0.048712
        std: 0.162450
        min: 0.0
        max: 3.421500

  ukea:
    name: "UK Environment Agency Catchment Site"
    tag: "ukea_8m_5min"
    spatial_resolution_m: 8.0
    grid_shape: [50, 120]
    total_grid_cells: 6000
    physical_dimensions_m: [400.0, 960.0]
    physical_area_sq_km: 0.384
    time_interval_minutes: 5.0
    water_depth_timesteps: 36
    rainfall_raw_timesteps: 360
    rainfall_substep_seconds: 30
    event_duration_hours: 3.0
    rainfall:
      raw_units: "mm / 30s"
      accumulated_units: "mm / 5min"
      raw_steps: 360
      dtype: "float64"
    water_depth:
      units: "m"
      steps: 36
      dtype: "float64"
    temporal_alignment:
      mode: "substep_summation"
      rainfall_substeps_per_frame: 10
      formula: "R_5min[t] = sum(R_30s[10*t : 10*(t+1)])"
    building_mask:
      rule: "dem >= 40.0 or isnan(dem)"
      boundary_wall_height_m: 40.0
      zero_rain_on_buildings: true
    normalization:
      fit_split: "train (16 events)"
      dem:
        mean: 28.486835
        std: 4.039457
        min: 21.148045
        max: 40.0
      rainfall:
        mean: 0.607498
        std: 0.627756
        min: 0.0
        max: 3.551322
      water_depth:
        mean: 0.126487
        std: 0.223847
        min: 0.0
        max: 1.912649
    official_32x32_crop:
      enabled: false  # Native full grid default; set true for 32x32 benchmarking
      row_start: 12
      row_end: 44
      col_start: 32
      col_end: 64
      height: 32
      width: 32
      dem_mean: 26.684261
      dem_std: 1.847113

# --- Shared Model Input Contracts ---
model_contracts:
  convlstm_unet:
    description: "Recurrent Spatiotemporal Encoder-Decoder for multi-step water depth forecasting"
    input_tensor_format: "[Batch, Time_in, Channels_in, Height, Width]"
    default_input_timesteps: 6      # Past 6 steps (30 minutes)
    default_forecast_timesteps: 6   # Future 6 steps (30 minutes)
    channels_in:
      - "rainfall_window_norm (past 6 steps of precipitation)"
      - "rainfall_cumsum_norm (cumulative precipitation up to current step)"
      - "dem_elevation_norm (static bare-earth terrain)"
      - "prior_water_depth_m (state at t_0)"
      - "building_mask (binary 0/1)"
    target_tensor_format: "[Batch, Time_out, 1, Height, Width]"
    loss_functions:
      - "masked_mse_loss (evaluates overland surface, excludes buildings)"
      - "csi_metric (Critical Success Index at 0.05m, 0.15m, 0.30m thresholds)"

  pino:
    description: "Physics-Informed Neural Operator mapping terrain and forcing to fluid depth"
    input_tensor_format: "[Batch, Channels_in, Time, Height, Width]"
    channels_in:
      - "dem_elevation_m (static DEM broadcast across time)"
      - "rainfall_rate_m_s (dynamic precipitation forcing in m/s)"
      - "initial_water_depth_m (h_0 broadcast across time)"
      - "manning_roughness_n (default 0.035 s*m^(-1/3))"
    target_tensor_format: "[Batch, 1, Time, Height, Width]"
    physics_losses:
      - "continuity_residual: dh/dt + d(hu)/dx + d(hv)/dy - R = 0"
      - "boundary_condition: zero normal flux on building barriers"

# --- Storage Policy ---
storage:
  git_tracking: "Code, configs, manifests, schemas, test fixtures only. Never commit full .npy arrays."
  external_storage: "Google Drive: Crestix Probe Shared / ml_data / larno_raw_100_events"
  cache_dir: "data/cache_larno"
